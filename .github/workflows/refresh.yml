name: refresh-draws
on:
  schedule:
    - cron: "0 3 3,18 * *" # after the 1st/16th draws (UTC)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx tsx scripts/ingest-draws.ts
      - run: npm test
      - run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add public/data
          git diff --cached --quiet || { git commit -m "chore: refresh draws"; git push; }
